$kind: http-request
url: "{{baseUrl}}/api/profiles/candidate"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{candidateAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Candidate can read own profile (200)', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
