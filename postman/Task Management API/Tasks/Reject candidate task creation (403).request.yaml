$kind: http-request
url: "{{baseUrl}}/api/tasks/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Candidate forbidden task"
    }
auth:
  type: bearer
  credentials:
    token: "{{candidateAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Candidate is forbidden from creating tasks (403)', function () { pm.response.to.have.status(403); });
      pm.test('Forbidden response uses standard envelope', function () { const body = pm.response.json(); pm.expect(body.success).to.eql(false); pm.expect(body.status_code).to.eql(403); });
    language: text/javascript
order: 8000
