$kind: http-request
url: "{{baseUrl}}/api/tasks/999999999/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Missing task returns 404', function () { pm.response.to.have.status(404); });
      pm.test('Not-found response uses standard envelope', function () { const body = pm.response.json(); pm.expect(body.success).to.eql(false); pm.expect(body.status_code).to.eql(404); });
    language: text/javascript
order: 10000
